name: Cresco Canvas CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone/**"
  workflow_dispatch:

concurrency:
  group: cresco-canvas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript, CSS, build, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run lint:md
      - run: npm run test:unit
      - run: npm run check:version
      - run: npm run build
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - run: npm run package:verify
      - name: Verify production archive contents
        run: |
          unzip -t dist/cresco-canvas.zip
          ! unzip -Z1 dist/cresco-canvas.zip | grep -E '(^|/)(node_modules|src|tests|\.github)(/|$)|\.map$'
      - name: Record frontend CSS size
        run: |
          gzip -c assets/css/frontend.css > /tmp/cresco-frontend.css.gz
          test "$(wc -c < /tmp/cresco-frontend.css.gz)" -lt 40960
          wc -c assets/css/frontend.css /tmp/cresco-frontend.css.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cresco-canvas-0.4.0-alpha.1
          path: |
            dist/cresco-canvas.zip
            dist/cresco-canvas.zip.sha256
          if-no-files-found: error
          retention-days: 14

  php:
    name: PHP ${{ matrix.php }} syntax and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, phpunit:10
      - run: composer validate --strict
      - run: composer install --no-interaction --optimize-autoloader
      - name: PHP syntax
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: phpunit --configuration phpunit.xml.dist

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2, phpcs
      - name: Install WordPress and PHP compatibility standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress "wp-coding-standards/wpcs:^3.2" "phpcompatibility/phpcompatibility-wp:^2.1"
      - run: phpcs --standard=phpcs.xml.dist

  compatibility:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.7"
            core: "WordPress/WordPress#6.7"
            php: "8.1"
            experimental: false
          - wordpress: "6.9"
            core: "WordPress/WordPress#6.9"
            php: "8.3"
            experimental: false
          - wordpress: "7.0.1"
            core: "WordPress/WordPress#7.0.1"
            php: "8.5"
            experimental: false
          - wordpress: "trunk (experimental)"
            core: "WordPress/wordpress-develop#trunk"
            php: "8.5"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - name: Select WordPress and PHP test versions
        env:
          WP_CORE: ${{ matrix.core }}
          WP_PHP: ${{ matrix.php }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('.wp-env.json'));c.core=process.env.WP_CORE;c.phpVersion=process.env.WP_PHP;fs.writeFileSync('.wp-env.json',JSON.stringify(c,null,2)+'\n')"
      - run: npx wp-env start --update
      - run: npx wp-env run cli wp plugin activate cresco-canvas
      - run: npx wp-env run cli wp eval 'echo CRESCO_CANVAS_VERSION . PHP_EOL;'
      - name: Stop environment
        if: always()
        run: npx wp-env stop || true

  e2e:
    name: E2E, accessibility automation, and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx wp-env start --update
      - run: npm run test:e2e
      - name: Plugin Check
        run: |
          npx wp-env run cli wp plugin install plugin-check --activate
          npx wp-env run cli wp plugin check cresco-canvas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop environment
        if: always()
        run: npx wp-env stop || true
