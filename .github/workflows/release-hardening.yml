name: Release Hardening

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Reproducible release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Require committed dependency lock
        shell: bash
        run: test -s package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: composer validate --strict
      - run: composer install --no-dev --no-interaction --optimize-autoloader
      - run: npm run check:hygiene
      - run: npm run check:editor-runtime
      - run: npm run check:version
      - run: npm run build
      - name: Ensure generated bundles are committed
        run: git diff --exit-code -- build
      - run: npm run package:verify
      - name: Verify release archive surface
        shell: bash
        run: |
          unzip -t dist/cresco-canvas.zip
          ! unzip -Z1 dist/cresco-canvas.zip | grep -E '(^|/)(node_modules|src|tests|\.github)(/|$)|\.map$'
          ! unzip -Z1 dist/cresco-canvas.zip | grep -E '(editor-hub|elements-usage-sort|workspace-layout|widget-inspector(-compat)?|standalone-content-bootstrap|native-gutenberg-bridge)'
          unzip -Z1 dist/cresco-canvas.zip | grep -q 'cresco-canvas/build/standalone-visual-editor.js'
          unzip -Z1 dist/cresco-canvas.zip | grep -q 'cresco-canvas/build/standalone-page-settings.js'
          unzip -Z1 dist/cresco-canvas.zip | grep -q 'cresco-canvas/build/global-config-import.js'
          unzip -Z1 dist/cresco-canvas.zip | grep -q 'cresco-canvas/build/viewport-shell.js'
      - uses: actions/upload-artifact@v4
        with:
          name: cresco-canvas-1.0.0-rc.1
          path: |
            dist/cresco-canvas.zip
            dist/cresco-canvas.zip.sha256
          if-no-files-found: error
          retention-days: 14
