name: Main Release Hardening Trigger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: main-release-hardening-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch full release matrix
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release Hardening on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-hardening.yml --ref main
